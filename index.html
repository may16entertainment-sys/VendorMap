<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amman Christmas Market Vendor Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console. Top bar, the floor plan as the working surface, a right rail for totals and the selected booth. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#d3dad6; --fg:#17201c; --muted:#5d6b64;
  --accent:#12665a; --accent-fg:#ffffff; --accent-soft:#d8ece8;
  --avail:#1f8f55; --pend:#4f5fc4; --pend-soft:#e1e5fa; --hold:#d88a0b; --hold-soft:#fbecd0; --taken:#d23b32; --taken-soft:#f8dcd9;
  --grid:rgba(18,102,90,.08); --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.08);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --sunk:#0d1311; --line:#2c3833; --fg:#e6ece9; --muted:#95a39c;
  --accent:#4fc3ae; --accent-fg:#06221d; --accent-soft:#16342e;
  --avail:#3ec47e; --pend:#93a0f2; --pend-soft:#22284d; --hold:#f0a73a; --hold-soft:#3a2a10; --taken:#f0615a; --taken-soft:#3d1a18;
  --grid:rgba(79,195,174,.07); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --sunk:#0d1311; --line:#2c3833; --fg:#e6ece9; --muted:#95a39c;
  --accent:#4fc3ae; --accent-fg:#06221d; --accent-soft:#16342e;
  --avail:#3ec47e; --pend:#93a0f2; --pend-soft:#22284d; --hold:#f0a73a; --hold-soft:#3a2a10; --taken:#f0615a; --taken-soft:#3d1a18;
  --grid:rgba(79,195,174,.07); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 220px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--avail);box-shadow:0 0 0 3px color-mix(in srgb,var(--avail) 25%,transparent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--taken);border-color:color-mix(in srgb,var(--taken) 40%,var(--line))}
.btn.hold{background:var(--hold-soft);border-color:var(--hold);color:var(--fg)}
.btn.red{background:var(--taken);border-color:var(--taken);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.mapwrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.maptools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.maptools .sp{flex:1}
.hint{font-size:12px;color:var(--muted)}
.viewport{flex:1;min-height:0;overflow:auto;padding:16px;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--sunk)}
.stage{position:relative;margin:0 auto;background:#fff;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.stage.noplan{background:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:4% 6.4%}
.stage.editing{touch-action:none;cursor:crosshair}
.stage img{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none}
.booth{position:absolute;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 28%,transparent);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;cursor:pointer;color:#111;transition:box-shadow .12s}
.booth .lb{font-family:var(--f-display);font-weight:700;line-height:1;text-align:center;padding:0 2px;white-space:nowrap;text-shadow:0 0 3px rgba(255,255,255,.9)}
.booth .sub{font-family:var(--f-mono);font-size:.6em;opacity:.8}
.booth:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
.booth.hold{--c:var(--hold);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--hold) 55%,transparent) 0 6px,color-mix(in srgb,var(--hold) 25%,transparent) 6px 12px)}
.booth.taken{--c:var(--taken);background:color-mix(in srgb,var(--taken) 78%,transparent);color:#fff}
.booth.taken .lb{text-shadow:0 0 3px rgba(0,0,0,.5)}
.booth.sel{box-shadow:0 0 0 3px var(--fg),0 0 0 6px var(--surface);z-index:3}
.booth.dim{opacity:.25}
.stage.editing .booth{cursor:move}
.handle{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;background:var(--fg);border:2px solid var(--surface);cursor:nwse-resize;border-radius:2px}
.draft{position:absolute;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.empty .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:420px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--f-display);text-transform:uppercase;font-size:22px;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
/* side */
.side{min-width:0;min-height:0;overflow:auto;background:var(--surface);border-left:1px solid var(--line)}
.sec{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:8px;background:var(--sunk)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.a b{color:var(--avail)} .stat.h b{color:var(--hold)} .stat.t b{color:var(--taken)}
.money{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.money b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.catrow{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.li:hover{background:var(--bg)}
.li .lbl{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:48px}
.li .meta{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.a{background:color-mix(in srgb,var(--avail) 15%,transparent);color:var(--avail)}
.pill.h{background:var(--hold-soft);color:var(--hold)}
.pill.t{background:var(--taken-soft);color:var(--taken)}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dhead h2{margin:0;font-family:var(--f-display);font-size:34px;line-height:.95;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font-weight:400;font-size:14px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addon{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px}
.addon .ah{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.opt small{font-family:var(--f-mono);font-weight:400;color:var(--muted);margin-left:4px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.qty span{min-width:28px;text-align:center;font-family:var(--f-mono)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px;border-radius:8px;background:var(--sunk)}
.total b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.confirm{padding:12px;border-radius:8px;border:2px solid var(--taken);background:var(--taken-soft);display:flex;flex-direction:column;gap:10px}
.note{font-size:12px;color:var(--muted)}
.warn{font-size:13px;padding:10px;border-radius:8px;background:var(--hold-soft)}
/* settings drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dtop{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dtop h2{margin:0;font-family:var(--f-display);text-transform:uppercase;font-size:24px}
.dbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:20px}
.dfoot{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.srow{display:grid;grid-template-columns:36px 1fr 90px 90px 32px;gap:6px;align-items:center}
.srow input[type=color]{width:36px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.shead{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.acard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:1fr 130px 32px;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(320px,58vh) auto;overflow:auto}
  .side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .srow{grid-template-columns:36px 1fr 70px 70px 28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1 id="evName">Amman Christmas Market Vendor Map</h1><span class="live" id="live"><i></i><span id="liveTxt">Connecting</span></span></div>
    <select id="evSel" class="inp evsel" aria-label="Switch event" hidden></select>
    <button class="btn" id="btnEvents" hidden>Events</button>
    <div class="seg" id="modeSeg" hidden>
      <button id="mSell" aria-pressed="true">Sell</button>
      <button id="mEdit" aria-pressed="false">Edit layout</button>
    </div>
    <button class="btn" id="btnVendors" hidden>Vendors</button>
    <button class="btn" id="btnSettings" hidden>Settings &amp; team</button>
    <button class="btn" id="btnExport" hidden>Export CSV</button>
    <span class="who" id="who" hidden></span>
    <button class="btn" id="btnLogin">Log in</button>
    <button class="btn" id="btnLogout" hidden>Log out</button>
  </header>
  <div class="main">
    <section class="mapwrap">
      <div class="maptools">
        <div class="seg"><button id="zOut" aria-label="Zoom out">−</button><button id="zFit">Fit</button><button id="zIn" aria-label="Zoom in">+</button></div>
        <span class="legend"><span><i class="lg a"></i>Available</span><span><i class="lg p"></i>Pending review</span><span><i class="lg h"></i>On hold</span><span><i class="lg t"></i>Reserved</span></span>
        <span class="legend mineleg" id="legendMine" hidden><span><i class="lg m"></i>Available booths</span></span><span class="hint" id="toolHint"></span>
        <span class="sp"></span>
        <span id="editTools" hidden class="edittools">
          <label class="f inline">New booths as <select id="drawCat" class="inp"></select></label><select id="drawShape" class="inp shp" aria-label="Shape for new booths"><option value="rect">Square</option><option value="round">Round</option></select>
          <button class="btn" id="btnText" aria-pressed="false">T Add text</button>
          <button class="btn" id="btnHand" aria-pressed="false">✋ Move map</button>
          <label class="btn" for="planFile" style="cursor:pointer">Replace floor plan</label>
        </span>
        <button class="btn" id="btnPanel" aria-controls="side">Hide panel ›</button>
        <input type="file" id="planFile" accept="application/pdf,image/*" hidden>
      </div>
      <div class="viewport" id="viewport"><div class="stage" id="stage"></div></div>
    </section>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div id="drawerHost"></div>
<div class="toast" id="toast" hidden></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, initializeFirestore, doc, collection, onSnapshot, getDoc, getDocs, setDoc, updateDoc, deleteDoc, deleteField, runTransaction, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, initializeAuth, inMemoryPersistence, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

/* Your Firebase project. These values are meant to be public; security comes from the Firestore rules. */
const firebaseConfig = {
  apiKey: "AIzaSyCJiFVKbLKgaQnHFSnCp7no_Rv9xa9piA0",
  authDomain: "acm-vendors.firebaseapp.com",
  projectId: "acm-vendors",
  storageBucket: "acm-vendors.firebasestorage.app",
  messagingSenderId: "244342754856",
  appId: "1:244342754856:web:adec37ff5071f23a406f1d"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {ignoreUndefinedProperties: true}); // empty values are skipped instead of failing a save
const auth = getAuth(app);

/* ---------- events ----------
   The first event (Amman Christmas Market) lives at the top of the database as before ("main").
   Every new event lives under events/{id}/... with exactly the same layout.
   The event shown is picked by ?e=<id> in the address. */
const EID = ((new URLSearchParams(location.search).get('e') || 'main').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'main';
const evPath = (eid, ...segs) => eid === 'main' ? segs : ['events', eid, ...segs];
const P_ = (...segs) => evPath(EID, ...segs);
// Vendor logins for a new event are separate accounts: name+e-<id>@domain (never emailed; only used to log in).
const aliasEmail = (email, eid) => eid === 'main' ? email : email.replace('@', `+e-${eid}@`);
const realEmail = e => String(e || '').replace(/\+e-[a-z0-9]+@/, '@');
const eventOfEmail = e => { const m = /\+e-([a-z0-9]+)@/.exec(String(e || '')); return m ? m[1] : 'main'; };
const eventUrl = eid => location.origin + location.pathname + (eid === 'main' ? '' : '?e=' + eid);
const R = {
  cfg: doc(db, ...P_('cfg', 'main')),
  layout: doc(db, ...P_('layout', 'main')),
  plan: doc(db, ...P_('plan', 'meta')),
  chunks: collection(db, ...P_('plan', 'meta', 'chunks')),
  status: doc(db, ...P_('public', 'status')),
  sales: collection(db, ...P_('sales')),
  team: collection(db, 'team'), // one team for all events
  requests: collection(db, ...P_('requests')),
  vendors: collection(db, ...P_('vendors')),
  pricing: doc(db, ...P_('pricing', 'main')),
  events: doc(db, 'meta', 'events'),
};
const EVENT_NAME = 'Amman Christmas Market Vendor Map';
const DEFAULT_CFG = {
  event: {name: EVENT_NAME, currency: 'JOD'},
  cats: [
    {id:'cmarket', name:'Market', color:'#2f7fd1'},
    {id:'cfood', name:'Food', color:'#e07a1f'},
    {id:'cdrinks', name:'Drinks', color:'#8a4fd1'},
    {id:'cbazaar', name:'Bazaar', color:'#1f9e6e'},
  ],
};
// Prices live in a separate private document that only the team and invited vendors can read.
const DEFAULT_PRICING = {
  taxRate: 16,
  cats: {cmarket:{base:100, perSqm:0}, cfood:{base:150, perSqm:0}, cdrinks:{base:120, perSqm:0}, cbazaar:{base:80, perSqm:0}},
  booths: {},
  addons: [
    {id:'aelec', name:'Electricity', kind:'choice', cats:[], options:[{label:'None',price:0},{label:'6 A',price:15},{label:'16 A',price:35},{label:'32 A',price:70}]},
    {id:'atable', name:'Extra table', kind:'qty', price:10, max:6, cats:[]},
    {id:'awater', name:'Water connection', kind:'check', price:25, cats:[]},
  ],
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const newId = () => 'b' + Date.now().toString(36) + uid().slice(0, 3);

const S = {
  email:null, verified:false, role:null, // role: 'admin' | 'staff' | null
  cfgLoaded:false, event:{name:'', currency:'JOD'}, cats:[], addons:[],
  planMeta:null, planUrl:null, planVer:null,
  booths:new Map(), pendingBooths:null, status:{}, sales:new Map(),
  sel:null, mode:'sell', zoom:1, filter:'all', q:'',
  form:null, confirming:null, busy:false, releasing:false, live:false, sideKey:'', drag:null,
  pricing:null, legacy:{cats:[], addons:[]}, labels:new Map(), selLabel:null, addingText:false, unsubPricing:null,
  unsubSales:null, unsubReq:null, unsubInv:null, invite:null, requests:new Map(), reqSent:null, reqErr:'',
};
const isAdmin = () => S.role === 'admin';
const isTeam = () => S.role === 'admin' || S.role === 'staff';
const isVendor = () => S.role === 'vendor';

/* ---------- helpers ---------- */
// Category = public look (name, colours) + private prices when this viewer may read them
function cat(id){
  const c = S.cats.find(c => c.id === id) || {id:'', name:'Uncategorised', color:'#8a948f'};
  const legacy = (S.legacy.cats || []).find(x => x.id === id) || {};
  const p = (S.pricing && S.pricing.cats && S.pricing.cats[id]) || {};
  return {base: +legacy.base || 0, perSqm: +legacy.perSqm || 0, ...c, ...p};
}
const strokeOf = c => c.stroke || c.color;
const swatch = c => `<span class="sw inl" style="--c:${esc(c.color)};--s:${esc(strokeOf(c))}"></span>`;
const pricesKnown = () => !!S.pricing || isTeam();
const taxRate = () => S.pricing && S.pricing.taxRate !== undefined ? +S.pricing.taxRate || 0 : 16;
const money = n => (Math.round((+n||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2});
const fmt = n => money(n) + ' ' + (S.event.currency||'');
const num = n => (Math.round((+n||0)*1000)/1000).toLocaleString(undefined,{maximumFractionDigits:3});
const isRound = b => b.shape === 'round';
const diaOf = b => +b.dia || +b.wm || 0;
const area = b => isRound(b) ? Math.PI * Math.pow(diaOf(b) / 2, 2) : (+b.wm||0) * (+b.dm||0);
const sizeText = b => isRound(b) ? (diaOf(b) ? `Ø ${num(diaOf(b))} m · ${num(area(b))} m²` : '—') : (b.wm && b.dm ? `${num(b.wm)} m × ${num(b.dm)} m · ${num(area(b))} m²` : '—');
const sizeShort = b => isRound(b) ? (diaOf(b) ? `Ø${num(diaOf(b))}` : '') : (b.wm && b.dm ? `${num(b.wm)}×${num(b.dm)}` : '');
function fixedPrice(id, b){
  const p = S.pricing && S.pricing.booths ? S.pricing.booths[id] : undefined;
  if (p !== undefined && p !== null && p !== '') return +p;
  if (b && b.price !== null && b.price !== undefined && b.price !== '') return +b.price; // older data
  return null;
}
const boothId = b => { for (const [id, x] of S.booths) if (x === b) return id; return null; };
function basePrice(b, id){
  const fp = fixedPrice(id || boothId(b), b);
  return fp !== null ? fp : (+cat(b.cat).base||0) + (+cat(b.cat).perSqm||0) * area(b);
}
const addonsFor = b => S.addons.filter(a => !a.cats || !a.cats.length || a.cats.includes(b.cat || ''));
// Can this viewer see this booth's price?
const canSeePrice = id => isTeam() || (isVendor() && !!S.pricing && inviteAllows(id));
function addonCost(a, v){
  if (a.kind === 'choice'){ const o = (a.options||[])[v]; return o ? +o.price||0 : 0; }
  if (a.kind === 'qty') return (+v||0) * (+a.price||0);
  return v ? (+a.price||0) : 0;
}
function addonText(a, v){
  if (a.kind === 'choice'){ const o = (a.options||[])[v]; return o && +v > 0 ? `${a.name}: ${o.label}` : ''; }
  if (a.kind === 'qty') return +v ? `${a.name} ×${v}` : '';
  return v ? a.name : '';
}
const statusOf = id => { const s = S.status[id]; return !s ? 'avail' : s.s === 'reserved' ? 'taken' : s.s === 'pending' ? 'pend' : 'hold'; };
const reqMode = () => S.event.requestMode || (S.event.requestsOpen ? 'open' : 'off');
const reqOpen = () => reqMode() === 'open' || (reqMode() === 'invite' && isVendor());
// Which booths an invited vendor may see and request
function inviteAllows(id){
  const inv = S.invite, b = S.booths.get(id); if (!inv || !b) return false;
  return (inv.booths || []).includes(id) || (inv.cats || []).includes(b.cat || '');
}
const visibleBooth = id => true;
// Availability is shown to the team always; to everyone else only if the admin turns it on.
const showStatus = () => isTeam() || !!S.event.showStatus;
const ownBooth = id => isVendor() && S.invite && S.invite.used === id;
// The status a viewer is allowed to see for a booth ('none' = hidden)
const viewStatus = id => (showStatus() || ownBooth(id)) ? statusOf(id) : 'none';
// A vendor's assigned booth that they could still request (or the one they already requested)
const mineBooth = id => isVendor() && inviteAllows(id) && (ownBooth(id) || (!S.invite.used && statusOf(id) === 'avail'));
const pillV = (id, st) => viewStatus(id) === 'none' ? '' : pill(st);
const STATUS_LABEL = {avail:'Available', pend:'Pending review', hold:'On hold', taken:'Reserved'};
const pill = st => `<span class="pill ${({avail:'a',pend:'p',hold:'h',taken:'t'})[st]}">${STATUS_LABEL[st]}</span>`;
const sortedBooths = () => [...S.booths.entries()].sort((a,b) => String(a[1].label).localeCompare(String(b[1].label), undefined, {numeric:true}));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3600); }
function nextLabel(catId){
  const prefix = (cat(catId).name || 'B').trim().charAt(0).toUpperCase() || 'B';
  let n = 1; const used = new Set([...S.booths.values()].map(b => b.label));
  while (used.has(prefix + n)) n++; return prefix + n;
}
const permErr = e => e && (e.code === 'permission-denied' || /permission/i.test(e.message || ''));
const saveBooth = (id, partial) => setDoc(R.layout, {booths: {[id]: partial}}, {merge: true});
const saveLabel = (id, partial) => setDoc(R.layout, {labels: {[id]: partial}}, {merge: true});
async function addLabelAt(p){
  const id = 't' + Date.now().toString(36) + uid().slice(0, 3);
  const body = {text: 'Label', x: p.x, y: p.y, size: 2, color: '#17201c', rot: 0, style: 'tag'};
  S.labels.set(id, body); S.selLabel = id; S.sel = null; S.sideKey = ''; renderAll();
  setTimeout(() => { const t = $('#lText'); if (t){ t.focus(); t.select(); } }, 30);
  try { await saveLabel(id, body); } catch { toast('Could not save the text.'); }
}

/* ---------- map ---------- */
const stage = $('#stage'), viewport = $('#viewport');
function stageSize(){
  const vw = viewport.clientWidth - 32;
  const ratio = S.planMeta ? S.planMeta.h / S.planMeta.w : 0.62;
  const w = Math.max(280, vw * S.zoom);
  return {w, h: w * ratio};
}
function renderMap(){
  const {w, h} = stageSize();
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.classList.toggle('noplan', !S.planUrl);
  stage.classList.toggle('editing', S.mode === 'edit');
  const q = S.q.trim().toLowerCase();
  let html = S.planUrl ? `<img src="${S.planUrl}" alt="Floor plan">` : '';
  for (const [id, b0] of S.booths){
    if (!visibleBooth(id)) continue;
    const b = (S.drag && S.drag.id === id) ? {...b0, ...S.drag.cur} : b0;
    const st = viewStatus(id), c = cat(b.cat), sale = S.sales.get(id) || (S.requests.get(id) && {vendor: S.requests.get(id).business});
    const pw = b.w * w, ph = b.h * h;
    const fs = Math.max(8, Math.min(ph * 0.34, pw * 0.3, 20));
    const match = (S.filter === 'all' || S.filter === st || st === 'none') && (!q || String(b.label).toLowerCase().includes(q) || (sale && String(sale.vendor||'').toLowerCase().includes(q)));
    const cls = ['booth', b.shape === 'round' ? 'round' : '', st === 'hold' ? 'hold' : st === 'taken' ? 'taken' : st === 'pend' ? 'pend' : '', S.sel === id ? 'sel' : '', match ? '' : 'dim', isVendor() ? (mineBooth(id) ? 'mine' : 'other') : ''].join(' ');
    const sub = (ph > 34 && pw > 40) ? `<span class="sub">${st==='taken' ? 'SOLD' : st==='hold' ? 'HOLD' : st==='pend' ? 'PENDING' : esc(sizeShort(b))}</span>` : '';
    html += `<div class="${cls}" data-id="${id}" style="--c:${esc(c.color)};--s:${esc(strokeOf(c))};left:${b.x*100}%;top:${b.y*100}%;width:${b.w*100}%;height:${b.h*100}%;font-size:${fs}px;transform:rotate(${+b.rot||0}deg)" title="${esc(b.label)} · ${esc(c.name)}"><span class="inner" style="transform:rotate(${-(+b.rot||0)}deg)"><span class="lb">${esc(b.label)}</span>${sub}</span>${S.mode==='edit' && S.sel===id ? '<span class="handle" data-handle="1"></span><span class="rothandle" data-rotate="1" title="Drag to rotate"></span>' : ''}</div>`;
  }
  for (const [lid, l0] of S.labels){
    const l = (S.drag && S.drag.lid === lid) ? {...l0, ...S.drag.cur} : l0;
    html += `<div class="maplabel${l.style === 'tag' ? ' tag' : ''}${S.selLabel === lid && S.mode === 'edit' ? ' sel' : ''}" data-lid="${lid}" style="left:${l.x*100}%;top:${l.y*100}%;font-size:${(+l.size||2) / 100 * w}px;color:${esc(l.color || '#17201c')};transform:translate(-50%,-50%) rotate(${+l.rot||0}deg)">${esc(l.text || 'Text')}</div>`;
  }
  if (S.drag && S.drag.type === 'new'){ const r = S.drag.cur; html += `<div class="draft" style="left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%"></div>`; }
  if (!S.planUrl && !S.booths.size){
    html += `<div class="empty"><div class="card">${
      isAdmin() ? `<h2>Start with your floor plan</h2><p>Upload the 2D plan as a PDF or image. Then switch to Edit layout and drag across the plan to draw each booth.</p><label class="btn primary" for="planFile" style="cursor:pointer">Upload floor plan</label>` :
      `<h2>Floor plan coming soon</h2><p>The organiser hasn't uploaded the plan yet. This page updates by itself when they do.</p>`}</div></div>`;
  }
  stage.innerHTML = html;
}

side.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.filter){ S.filter = t.dataset.filter; renderAll(); return; }
  if (t.dataset.go){ focusBooth(t.dataset.go); return; }
  if (t.dataset.addon && !t.dataset.check){
    const a = S.addons.find(x => x.id === t.dataset.addon); if (!a) return;
    if (t.dataset.val !== undefined) S.form.addons[a.id] = +t.dataset.val;
    else { const cur = +S.form.addons[a.id]||0; S.form.addons[a.id] = Math.max(0, Math.min(+a.max || 99, cur + +t.dataset.step)); }
    S.sideKey = ''; renderSide(); return;
  }
  const act = t.dataset.act; if (!act) return;
  const id = S.sel, b = S.booths.get(id);
  switch (act){
    case 'login': return openLogin();
    case 'ldup-r': case 'ldup-d': {
      const src = S.labels.get(S.selLabel); if (!src) return;
      const el = stage.querySelector(`.maplabel[data-lid="${S.selLabel}"]`), sr = stage.getBoundingClientRect();
      const r = el ? el.getBoundingClientRect() : {width: sr.width * 0.1, height: sr.height * 0.04};
      const gap = 1.15;
      const nl = {...src,
        x: act === 'ldup-r' ? Math.min(0.98, src.x + r.width * gap / sr.width) : src.x,
        y: act === 'ldup-d' ? Math.min(0.98, src.y + r.height * gap / sr.height) : src.y};
      const nid = 't' + Date.now().toString(36) + uid().slice(0, 3);
      S.labels.set(nid, nl); S.selLabel = nid; S.sideKey = ''; renderAll();
      try { await saveLabel(nid, nl); } catch { toast('Could not save the copy.'); }
      return;
    }
    case 'ldelete': {
      const lid = S.selLabel; S.selLabel = null; S.labels.delete(lid); renderAll();
      try { await updateDoc(R.layout, {[`labels.${lid}`]: deleteField()}); toast('Text deleted'); } catch { toast('Could not delete. Try again.'); }
      return;
    }
    case 'close': S.editAddons = null; S.selLabel = null; S.sel = null; S.form = null; S.confirming = null; S.releasing = false; S.reqSent = null; S.reqErr = ''; renderAll(); return;
    case 'ask-hold': S.confirming = 'hold'; renderSide(); return;
    case 'ask-reserve': S.confirming = 'reserved'; renderSide(); return;
    case 'cancel': S.confirming = null; renderSide(); return;
    case 'commit': return commitSale(id, b);
    case 'approve-hold': return approveRequest(id, b, 'hold');
    case 'approve-paid': return approveRequest(id, b, 'reserved');
    case 'reject': S.confirming = 'reject'; renderSide(); return;
    case 'reject-yes': return rejectRequest(id, b);
    case 'paid': return markPaid(id);
    case 'release': S.releasing = true; renderSide(); return;
    case 'addons-edit': {
      const cur = statusOf(id) === 'pend' ? S.requests.get(id) : S.sales.get(id);
      S.editAddons = id; S.releasing = false; S.confirming = null;
      S.form = {addons: JSON.parse(JSON.stringify((cur && cur.addons) || {})), vendor: ''};
      S.sideKey = ''; renderSide(); return;
    }
    case 'addons-cancel': S.editAddons = null; S.form = null; S.sideKey = ''; renderSide(); return;
    case 'addons-save': return saveAddons(id, b);
    case 'release-no': S.releasing = false; renderSide(); return;
    case 'release-yes': return release(id);
    case 'delete':
      S.sel = null; S.booths.delete(id); renderAll();
      try { await updateDoc(R.layout, {[`booths.${id}`]: deleteField()}); toast(`Deleted ${b.label}`); } catch { toast('Could not delete. Try again.'); }
      return;
    case 'rot': {
      const dd = +t.dataset.d; let a = dd === 0 ? 0 : (+b.rot || 0) + dd;
      a = ((a % 360) + 360) % 360; if (a > 180) a -= 360;
      S.booths.set(id, {...b, rot: a}); renderAll();
      try { await saveBooth(id, {rot: a}); } catch { toast('Could not save that change.'); }
      return;
    }
    case 'dup-r': case 'dup-d': {
      const nb = {...b, label: nextLabel(b.cat)};
      const {w:W, h:H} = stageSize(), t = (+b.rot || 0) * Math.PI / 180;
      const ox = act === 'dup-r' ? b.w*W*Math.cos(t) : -b.h*H*Math.sin(t);
      const oy = act === 'dup-r' ? b.w*W*Math.sin(t) : b.h*H*Math.cos(t);
      nb.x = Math.min(1 - b.w, Math.max(0, b.x + ox / W)); nb.y = Math.min(1 - b.h, Math.max(0, b.y + oy / H));
      const nid = newId(); S.booths.set(nid, nb); S.sel = nid; renderAll();
      try { await saveBooth(nid, nb); } catch { toast('Could not save the copy.'); }
    }
  }
});

      if (S.pricing) await setDoc(R.pricing, {booths: {[id]: v === null ? deleteField() : v}}, {merge: true});
      else await saveBooth(id, {price: v});
      if (S.pricing) S.pricing = {...S.pricing, booths: {...(S.pricing.booths || {}), [id]: v}};
      S.sideKey = ''; renderAll();
    } catch { toast('Could not save the price.'); }
    return;
  }
  if (t.dataset.field && S.sel){
    let v = t.value; const f = t.dataset.field;
    if (f === 'wm' || f === 'dm' || f === 'dia') v = Math.round((+v || 0) * 1000) / 1000;
    if (f === 'shape' && v === 'round'){ const ob = S.booths.get(S.sel); if (!ob.dia) { S.booths.set(S.sel, {...ob, dia: +ob.wm || 3}); try { await saveBooth(S.sel, {dia: +ob.wm || 3}); } catch {} } }
    if (f === 'rot'){ v = Math.max(-180, Math.min(180, Math.round(+v || 0))); }
    if (f === 'price') v = v === '' ? null : +v;
    if (f === 'label' && !v.trim()) return;
    S.booths.set(S.sel, {...S.booths.get(S.sel), [f]: v}); renderAll();
    try { await saveBooth(S.sel, {[f]: v}); } catch { toast('Could not save that change.'); }
  }
});

/* ---------- booking: a Firestore transaction makes double-selling impossible ---------- */
function priceParts(b, addons){
  const subtotal = addonsFor(b).reduce((t, a) => t + addonCost(a, (addons||{})[a.id]), basePrice(b));
  const tax = Math.round(subtotal * taxRate()) / 100;
  return {subtotal: Math.round(subtotal * 100) / 100, tax, total: Math.round((subtotal + tax) * 100) / 100, rate: taxRate()};
}
function computeTotal(b, addons){ return priceParts(b, addons).total; }
function partsWithBase(b, addons, base){
  const subtotal = addonsFor(b).reduce((t, a) => t + addonCost(a, (addons||{})[a.id]), +base || 0);
  const tax = Math.round(subtotal * taxRate()) / 100;
  return {subtotal: Math.round(subtotal * 100) / 100, tax, total: Math.round((subtotal + tax) * 100) / 100, rate: taxRate()};
}
// Inline editor used for booked booths and pending requests
function addonEditor(b, base){
  const {html} = addonBlock(S.form, b);
  const p = partsWithBase(b, S.form.addons, base);

    ${totalBox(p, 'New total')}

    <div class="actions"><button class="btn" data-act="addons-cancel">Cancel</button><button class="btn primary" data-act="addons-save" ${S.busy?'disabled':''}>${S.busy ? 'Saving…' : 'Save add-ons'}</button></div></div>`;
}
const totalBox = (p, label = 'Total') => `<div class="totals"><div><span>Subtotal</span><b>${fmt(p.subtotal)}</b></div><div><span>VAT ${num(p.rate)}%</span><b>${fmt(p.tax)}</b></div><div class="grand"><span>${label} incl. VAT</span><b>${fmt(p.total)}</b></div></div>`;
async function commitSale(id, b){
  if (S.busy) return; S.busy = true; renderSide();
  const f = S.form, status = S.confirming;
  const addons = {}; for (const a of addonsFor(b)){ const v = f.addons[a.id]; if (v !== undefined && v !== false && v !== 0) addons[a.id] = v; }
  const P = priceParts(b, addons);
  const body = {status, vendor: f.vendor.trim(), phone: f.phone.trim(), notes: f.notes.trim(), addons, subtotal: P.subtotal, tax: P.tax, taxRate: P.rate, total: P.total, base: basePrice(b, id), label: b.label, by: S.email, at: Date.now()};
  try {
    await runTransaction(db, async tx => {
      const snap = await tx.get(R.status);
      const map = (snap.exists() && snap.data().map) || {};
      if (map[id]) throw new Error('TAKEN');
      tx.set(R.status, {map: {[id]: {s: status, at: body.at}}}, {merge: true});
      tx.set(doc(R.sales, id), body);
    });
    toast(status === 'reserved' ? `${b.label} reserved for ${body.vendor}` : `${b.label} on hold for ${body.vendor}`);
    S.form = null; S.confirming = null;
  } catch(err){
    if (err && err.message === 'TAKEN'){ toast(`${b.label} was just booked by someone else.`); S.confirming = null; }
    else toast(permErr(err) ? 'Your account can’t book booths. Ask the organiser to add you to the team.' : 'Could not save the booking. Check your connection and try again.');
  } finally { S.busy = false; S.sideKey = ''; renderAll(); }
}
async function saveAddons(id, b){
  if (S.busy) return;
  const pending = statusOf(id) === 'pend';
  const cur = pending ? S.requests.get(id) : S.sales.get(id); if (!cur) return;
  const addons = {}; for (const a of addonsFor(b)){ const v = S.form.addons[a.id]; if (v !== undefined && v !== false && v !== 0) addons[a.id] = v; }
  const base = pending ? (+cur.base > 0 ? +cur.base : basePrice(b, id)) : (cur.base !== undefined && cur.base !== null && cur.base !== '' ? +cur.base : basePrice(b, id));
  const P = partsWithBase(b, addons, base);
  S.busy = true; S.sideKey = ''; renderSide();
  try {
    const changes = {addons, subtotal: P.subtotal, tax: P.tax, total: P.total, base};
    if (!pending) Object.assign(changes, {taxRate: P.rate, addonsChangedAt: Date.now(), addonsChangedBy: S.email});
    await updateDoc(doc(pending ? R.requests : R.sales, id), changes);
    S.editAddons = null; S.form = null;
    toast(`Add-ons updated for ${b.label}. New total ${fmt(P.total)} incl. VAT.`);
  } catch(e){ toast(permErr(e) ? 'Only the team can change add-ons.' : 'Could not save. Try again.'); }
  finally { S.busy = false; S.sideKey = ''; renderAll(); }
}
async function markPaid(id){
  S.busy = true; renderSide();

    await runTransaction(db, async tx => {
      tx.set(R.status, {map: {[id]: {s: 'reserved', at: Date.now()}}}, {merge: true});
      tx.update(doc(R.sales, id), {status: 'reserved', paidAt: Date.now(), paidBy: S.email});

}
async function release(id){
  S.busy = true; renderSide();
  try {
    await runTransaction(db, async tx => {
      tx.update(R.status, {[`map.${id}`]: deleteField()});
      tx.delete(doc(R.sales, id));
    });
    S.releasing = false; toast('Booth released');
  } catch { toast('Could not release. Try again.'); } finally { S.busy = false; S.sideKey = ''; renderAll(); }
}

/* ---------- public booking requests ---------- */
async function sendRequest(id, b){
  if (S.busy || !b) return;
  const f = S.form, clean = v => String(v || '').trim();
  const name = clean(f.name), business = clean(f.business), phone = clean(f.phone), email = clean(f.email);
  const err = !name ? 'Please enter your name.' : !business ? 'Please enter your business or brand name.' :
    (phone.replace(/\D/g, '').length < 7) ? 'Please enter a phone number we can reach you on.' :
    (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) ? 'That email address doesn’t look right.' : '';
  if (err){ S.reqErr = err; S.sideKey = ''; renderSide(); return; }
  const addons = {}; for (const a of addonsFor(b)){ const v = f.addons[a.id]; if (v !== undefined && v !== false && v !== 0) addons[a.id] = v; }
  const at = Date.now();
  const via = isVendor() ? 'invite' : 'open';
  const body = {booth: id, label: String(b.label).slice(0, 40), name, business, phone, email: via === 'invite' ? S.email : email, via, what: clean(f.what), notes: clean(f.notes), addons,
    ...(canSeePrice(id) ? (P => ({subtotal: P.subtotal, tax: P.tax, total: P.total, base: basePrice(b, id)}))(priceParts(b, addons)) : {subtotal: 0, tax: 0, total: 0, base: 0}), at, status: 'pending'};
  S.busy = true; S.reqErr = ''; S.sideKey = ''; renderSide();
  try {
    const batch = writeBatch(db);
    batch.set(doc(R.requests, id), body);
    batch.set(R.status, {map: {[id]: {s: 'pending', at}}, lastReq: id}, {merge: true});
    if (via === 'invite') batch.update(doc(R.vendors, S.email), {used: id, usedAt: at});
    await batch.commit();
    S.reqSent = {id, name, phone, total: body.total}; S.form = null;
  } catch(e){
    S.reqErr = statusOf(id) !== 'avail' ? 'Sorry, someone just requested this booth. Please pick another one.' :
      permErr(e) ? (reqOpen() ? 'Sorry, this booth can’t be requested right now. Please pick another one or refresh the page.' : 'Online requests have just closed.') :
      'Couldn’t send your request. Check your internet connection and try again.';
  } finally { S.busy = false; S.sideKey = ''; renderAll(); }
}
async function approveRequest(id, b, status){
  if (S.busy) return; S.busy = true; S.sideKey = ''; renderSide();
  try {
    await runTransaction(db, async tx => {
      const rs = await tx.get(doc(R.requests, id));
      if (!rs.exists()) throw new Error('GONE');
      const r = rs.data(), now = Date.now();
      tx.set(doc(R.sales, id), {status, vendor: r.business, contact: r.name, phone: r.phone, email: r.email || '', what: r.what || '', notes: r.notes || '',
        addons: r.addons || {}, ...(+r.total ? {subtotal: r.subtotal ?? r.total, tax: r.tax ?? 0, total: r.total} : (P => ({subtotal: P.subtotal, tax: P.tax, total: P.total}))(priceParts(b, r.addons || {}))), taxRate: taxRate(), base: +r.base || basePrice(b, id), label: b.label, by: `Website request · approved by ${S.email}`, requestedAt: r.at, at: now, ...(status === 'reserved' ? {paidAt: now, paidBy: S.email} : {})});
      tx.set(R.status, {map: {[id]: {s: status, at: now}}}, {merge: true});
      tx.delete(doc(R.requests, id));
    });
    toast(status === 'reserved' ? `${b.label} approved and marked paid` : `${b.label} approved, on hold until paid`);
  } catch(e){ toast(e && e.message === 'GONE' ? 'That request was already handled by someone else.' : 'Could not approve. Try again.'); }
  finally { S.busy = false; S.confirming = null; S.sideKey = ''; renderAll(); }
}
async function rejectRequest(id, b){
  if (S.busy) return; S.busy = true; S.sideKey = ''; renderSide();
  try {
    const batch = writeBatch(db);
    batch.delete(doc(R.requests, id));
    batch.update(R.status, {[`map.${id}`]: deleteField()});
    const r = S.requests.get(id);
    if (r && r.via === 'invite' && r.email){
      try { const v = await getDoc(doc(R.vendors, r.email)); if (v.exists() && v.data().used === id) batch.update(doc(R.vendors, r.email), {used: null}); } catch {}
    }
    await batch.commit();
    toast(`Request rejected. ${b.label} is available again.`);
  } catch { toast('Could not reject. Try again.'); }
  finally { S.busy = false; S.confirming = null; S.sideKey = ''; renderAll(); }
}

/* ---------- floor plan upload ---------- */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function fileToJpeg(file){
  const MAXW = 2400; let canvas;
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)){
    if (!window.pdfjsLib){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const pdf = await window.pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    const page = await pdf.getPage(1); const v1 = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: MAXW / v1.width});
    canvas = document.createElement('canvas'); canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
  } else {
    const url = URL.createObjectURL(file); const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const sc = Math.min(1, MAXW / img.naturalWidth);
    canvas = document.createElement('canvas'); canvas.width = Math.round(img.naturalWidth * sc); canvas.height = Math.round(img.naturalHeight * sc);
    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
  }
  let q = 0.85, data = canvas.toDataURL('image/jpeg', q);
  while (data.length > 3_500_000 && q > 0.4){ q -= 0.12; data = canvas.toDataURL('image/jpeg', q); }
  return {data, w: canvas.width, h: canvas.height};
}
$('#planFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  toast('Preparing the floor plan…');
  try {
    const {data, w, h} = await fileToJpeg(file);
    const CH = 700000, n = Math.ceil(data.length / CH), ver = Date.now();
    for (let i = 0; i < n; i++) await setDoc(doc(R.chunks, 'c' + i), {i, v: ver, d: data.slice(i*CH, (i+1)*CH)});
    const old = S.planMeta ? S.planMeta.n : 0;
    await setDoc(R.plan, {w, h, n, v: ver, name: file.name});
    for (let i = n; i < old; i++) await deleteDoc(doc(R.chunks, 'c' + i));
    toast('Floor plan uploaded. Switch to Edit layout to draw booths.');
  } catch(err){ console.error(err); toast(permErr(err) ? 'Only admins can change the floor plan.' : 'Could not read that file. Try a PDF or a PNG/JPG.'); }
});
async function loadPlan(meta){
  if (!meta){ S.planUrl = null; S.planMeta = null; renderMap(); return; }
  S.planMeta = meta;
  if (S.planVer === meta.v) return;
  try {
    const snap = await getDocs(R.chunks);
    const parts = snap.docs.map(d => d.data()).filter(d => d.v === meta.v).sort((a, b) => a.i - b.i);
    if (parts.length < meta.n){ setTimeout(() => loadPlan(meta), 1500); return; }
    S.planUrl = parts.map(p => p.d).join(''); S.planVer = meta.v; renderMap();
  } catch { toast('Could not load the floor plan.'); }
}

// One-time move of prices out of the public settings into the private pricing document.
async function migratePricing(){
  try {
    const ps = await getDoc(R.pricing);
    if (ps.exists()) return;
    const [cs, ls] = await Promise.all([getDoc(R.cfg), getDoc(R.layout)]);
    const cfg = cs.exists() ? cs.data() : null, booths = ls.exists() ? (ls.data().booths || {}) : {};
    const pricing = JSON.parse(JSON.stringify(DEFAULT_PRICING));
    if (cfg){
      pricing.cats = {}; for (const c of (cfg.cats || [])) pricing.cats[c.id] = {base: +c.base || 0, perSqm: +c.perSqm || 0};
      if (cfg.addons) pricing.addons = cfg.addons.map(a => ({cats: [], ...a}));
    }
    for (const [id, b] of Object.entries(booths)) if (b.price !== null && b.price !== undefined && b.price !== '') pricing.booths[id] = +b.price;
    const batch = writeBatch(db);
    batch.set(R.pricing, pricing);
    if (cfg) batch.set(R.cfg, {event: {...(cfg.event || {}), name: (!cfg.event || !cfg.event.name || cfg.event.name === 'Booth Map') ? EVENT_NAME : cfg.event.name}, cats: (cfg.cats || []).map(({base, perSqm, ...rest}) => rest)});
    else batch.set(R.cfg, DEFAULT_CFG);
    const strip = {}; for (const [id, b] of Object.entries(booths)) if ('price' in b) strip[`booths.${id}.price`] = deleteField();
    if (Object.keys(strip).length) batch.update(R.layout, strip);
    await batch.commit();
    toast('Prices are now private: only your team and invited vendors can see them.');
  } catch(e){ console.warn('Price migration skipped', e); }
}
async function applyUser(u){
  const authEmail = u ? (u.email || '').toLowerCase() : null;

  S.authEvent = authEmail ? eventOfEmail(authEmail) : null;
  S.verified = !!(u && u.emailVerified);
  S.role = null; S.invite = null; S.pricing = null;
  if (S.unsubInv){ S.unsubInv(); S.unsubInv = null; }
  if (S.unsubPricing){ S.unsubPricing(); S.unsubPricing = null; }
  if (u && S.email){
    {
      let teamDoc = null;
      try { teamDoc = await getDoc(doc(R.team, S.email)); } catch {}
      if (teamDoc && teamDoc.exists()) S.role = teamDoc.data().role;
      else if (teamDoc && S.verified){
        // Only the owner (named in the Firestore rules) gets this far without being on the team: make them admin.
        try { await setDoc(doc(R.team, S.email), {role: 'admin', addedAt: Date.now()}); S.role = 'admin'; } catch {}
      }
    }

          S.role = 'vendor'; S.invite = v.data();
          S.unsubInv = onSnapshot(doc(R.vendors, S.email), snap => { S.invite = snap.exists() ? snap.data() : null; if (!S.invite) S.role = null; S.sideKey = ''; renderAll(); }, () => {});
        }
      } catch {}
    }
  }
  if (S.unsubSales){ S.unsubSales(); S.unsubSales = null; S.sales = new Map(); }
  if (S.unsubReq){ S.unsubReq(); S.unsubReq = null; S.requests = new Map(); }
  if (isAdmin()){
    // (New events get these when they're created; a mistyped event link never creates anything.)
    if (EID === 'main'){
      try { const st = await getDoc(R.status); if (!st.exists()) await setDoc(R.status, {map: {}}); } catch {}
      await migratePricing();
    }
  }
  if (isTeam() || isVendor()){
    S.unsubPricing = onSnapshot(R.pricing, snap => { S.pricing = snap.exists() ? snap.data() : null; S.addons = S.pricing ? (S.pricing.addons || []) : (S.legacy.addons || []); S.sideKey = ''; renderAll(); }, () => {});
  }
  if (isTeam()) loadEvents();
  if (isTeam()){
    S.unsubSales = onSnapshot(R.sales, snap => { S.sales = new Map(snap.docs.map(d => [d.id, d.data()])); renderAll(); }, () => {});

let secAuth = null;
function secondaryAuth(){
  if (!secAuth){ const a2 = initializeApp(firebaseConfig, 'vendor-invites'); secAuth = initializeAuth(a2, {persistence: inMemoryPersistence}); }
  return secAuth;
}
function makeCode(){
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint32Array(8));
  let c = ''; for (const x of r) c += A[x % A.length];
  return c.slice(0, 4) + '-' + c.slice(4);
}
// Vendor logins belong to the event open now; team logins (forTeam) work for every event.
async function createVendorLogin(email, forTeam = false){
  const eid = forTeam ? 'main' : EID;
  const code = (eid === 'main' ? '' : eid.toUpperCase() + '-') + makeCode();
  try {
    const cred = await createUserWithEmailAndPassword(secondaryAuth(), aliasEmail(email, eid), code);
    const uidV = cred.user.uid; await signOut(secondaryAuth());
    return {uid: uidV, code};
  } catch(e){
    if ((e.code || '').includes('email-already-in-use')) return {exists: true};
    throw e;
  }
}

async function createEvent(id, name, copySettings, copyLayout){
  const at = (...segs) => doc(db, ...evPath(id, ...segs));
  const clean = x => JSON.parse(JSON.stringify(x));
  const ev = {name, currency: S.event.currency || 'JOD', requestMode: 'invite', showStatus: false};
  if (copySettings) for (const k of ['currency', 'requestMode', 'showStatus', 'contact', 'mailSubject', 'mailBody']) if (S.event[k] !== undefined) ev[k] = S.event[k];
  const cats = copySettings ? S.cats : DEFAULT_CFG.cats;
  const pricing = copySettings && S.pricing ? {taxRate: taxRate(), cats: S.pricing.cats || {}, addons: S.pricing.addons || [], booths: copyLayout ? (S.pricing.booths || {}) : {}} : DEFAULT_PRICING;
  const layout = copyLayout ? {booths: Object.fromEntries(S.booths), labels: Object.fromEntries(S.labels)} : {booths: {}, labels: {}};
  const batch = writeBatch(db);
  batch.set(at('cfg', 'main'), clean({event: ev, cats}));
  batch.set(at('pricing', 'main'), clean(pricing));
  batch.set(at('layout', 'main'), clean(layout));
  batch.set(at('public', 'status'), {map: {}});
  batch.set(R.events, {list: {[id]: {name, at: Date.now(), by: S.email}, ...(EID === 'main' && !(S.events && S.events.main) ? {main: {name: S.event.name || EVENT_NAME}} : {})}}, {merge: true});
  await batch.commit();
  if (copyLayout && S.planMeta){
    const chunks = await getDocs(R.chunks);
    for (const c of chunks.docs) await setDoc(doc(db, ...evPath(id, 'plan', 'meta', 'chunks', c.id)), c.data());
    await setDoc(at('plan', 'meta'), clean(S.planMeta));
  }
}

function parseBoothList(text){
  const byLabel = new Map([...S.booths.entries()].map(([id, b]) => [String(b.label).trim().toLowerCase(), id]));
  const wanted = String(text || '').split(/[,;\s\/|]+/).map(x => x.trim()).filter(Boolean);
  return {ids: [...new Set(wanted.filter(l => byLabel.has(l.toLowerCase())).map(l => byLabel.get(l.toLowerCase())))], missing: wanted.filter(l => !byLabel.has(l.toLowerCase()))};
}

      if (rows.some(r => !r.ids.length) && !V.importCats.length && !rows.every(r => V.list.find(v => v.email === r.email))){
        if (!window.confirm('Some vendors have no booths and you haven’t ticked a category. Import them anyway? You can give them booths later with Edit.')) return;
      }
      V.busy = true; let done = 0, made = 0, existed = [], stopped = '';
      for (const r of rows){
        V.progress = `Importing ${done + 1} of ${rows.length}…`; draw();
        const prev = V.list.find(v => v.email === r.email);
        const cats = [...new Set([...(prev ? prev.cats || [] : []), ...V.importCats])];
        const booths = r.ids.length ? r.ids : (prev ? prev.booths || [] : []);
        try { const login = await saveVendor(r.email, r.name, cats, booths); if (login.code && !(prev && prev.code)) made++; if (login.exists) existed.push(r.email); }
        catch(err){ if ((err.code || '').includes('too-many')){ stopped = `Firebase paused new logins after ${made}. The rest are saved without a code; press “Create missing codes” in an hour.`; 
            for (const rest of rows.slice(done)){ const p2 = V.list.find(v => v.email === rest.email); try { await setDoc(doc(R.vendors, rest.email), {name: rest.name || (p2 && p2.name) || '', cats: [...new Set([...(p2 ? p2.cats || [] : []), ...V.importCats])], booths: rest.ids.length ? rest.ids : (p2 ? p2.booths || [] : []), used: p2 ? p2.used || null : null, uid: p2 ? p2.uid || null : null, code: p2 ? p2.code || null : null, sent: p2 ? !!p2.sent : false, addedAt: Date.now(), addedBy: S.email}); } catch {} }
            break; }
          bad.push(`${r.email}: couldn’t be added`); }
        done++; await wait(120);
      }
      V.busy = false;
      V.progress = stopped || `Imported ${done} vendor${done === 1 ? '' : 's'}, ${made} new access code${made === 1 ? '' : 's'}.` + (existed.length ? ` ${existed.length} already had a login (Gmail users can use Google).` : '') + (bad.length ? ` Check: ${bad.slice(0, 5).join('; ')}${bad.length > 5 ? '…' : ''}` : '');
      if (!stopped) { V.importText = ''; V.open = ''; }
      draw(); return;
    }
    if (a === 'allcodes'){
      const todo = V.list.filter(v => !v.code && !v.uid);
      V.busy = true; let made = 0, skipped = 0, stopped = '';
      for (const v2 of todo){
        V.progress = `Creating code ${made + skipped + 1} of ${todo.length}…`; draw();
        try { const login = await createVendorLogin(v2.email); if (login.exists) skipped++; else { await updateDoc(doc(R.vendors, v2.email), {uid: login.uid, code: login.code}); made++; } }
        catch(err){ if ((err.code || '').includes('too-many')){ stopped = ` Firebase paused new logins; press this again in an hour for the rest.`; break; } skipped++; }
        await wait(120);
      }
      V.busy = false; V.progress = `Created ${made} access code${made === 1 ? '' : 's'}.${skipped ? ` ${skipped} already had a login.` : ''}${stopped}`; draw(); return;
    }
    if (a === 'export'){
      const csvq = x => `"${String(x ?? '').replace(/"/g, '""')}"`;
      const out = [['Business','Email','Booths they can request','Access code','Login message sent','Requested booth','Request status','Email subject','Email body']];
      for (const v2 of visible()) out.push([v2.name, v2.email, accessText(v2), v2.code || '', v2.sent ? 'Yes' : 'No', v2.used ? labelOf(v2.used) : '', v2.used ? STATUS_LABEL[statusOf(v2.used)] : '', v2.code ? mailSubject(v2) : '', v2.code ? loginMessage(v2) : '']);
      const blob = new Blob(['﻿' + out.map(r => r.map(csvq).join(',')).join('\n')], {type: 'text/csv'});
      const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'vendors.csv'; document.body.appendChild(l); l.click(); l.remove();
      return;
    }
  };
}
$('#btnVendors').onclick = openVendors;

/* ---------- export ---------- */
$('#btnExport').onclick = () => {
  const csvq = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Booth','Category','Shape','Width m','Depth m','Diameter m','Area m²','Status','Business','Contact name','Phone','Email','Selling','Add-ons','Subtotal','VAT','Total incl. VAT','Source / booked by','Date','Notes']];
  for (const [id, b] of sortedBooths()){
    const st = statusOf(id), s = S.sales.get(id), r = S.requests.get(id);
    const x = s || (r && {vendor: r.business, contact: r.name, phone: r.phone, email: r.email, what: r.what, addons: r.addons, subtotal: r.subtotal, tax: r.tax, total: r.total, by: 'Website request (pending)', at: r.at, notes: r.notes});
    const P = priceParts(b, x ? x.addons || {} : {});
    rows.push([b.label, cat(b.cat).name, isRound(b) ? 'Round' : 'Rectangle', isRound(b) ? '' : num(b.wm), isRound(b) ? '' : num(b.dm), isRound(b) ? num(diaOf(b)) : '', num(area(b)), STATUS_LABEL[st], x?.vendor, x?.contact, x?.phone, x?.email, x?.what,
      x ? S.addons.map(a => addonText(a, (x.addons||{})[a.id])).filter(Boolean).join('; ') : '',
      x && +x.total ? (x.subtotal ?? x.total) : P.subtotal, x && +x.total ? (x.tax ?? '') : P.tax, x && +x.total ? x.total : P.total, x?.by, x?.at ? new Date(x.at).toLocaleString() : '', x?.notes]);
  }
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvq).join(',')).join('\n')], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `${(S.event.name || 'booths').replace(/[^\w\- ]+/g, '').trim() || 'booths'}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

/* ---------- top bar ---------- */
function setMode(m){ S.mode = m; S.confirming = null; renderAll(); }
$('#mSell').onclick = () => setMode('sell');
$('#mEdit').onclick = () => setMode('edit');
function renderTop(){
  const name = S.noEvent ? 'Event not found – check the link' : S.event.name || EVENT_NAME;
  $('#evName').textContent = name; document.title = name;
  $('#live').classList.toggle('on', S.live); $('#liveTxt').textContent = S.live ? 'Live' : 'Connecting';
  $('#mSell').setAttribute('aria-pressed', S.mode === 'sell'); $('#mEdit').setAttribute('aria-pressed', S.mode === 'edit');
  { const sel = $('#evSel'), list = isTeam() ? eventList() : [];
    sel.hidden = !isTeam() || (list.length < 2 && EID === 'main'); $('#btnEvents').hidden = !isTeam();
    const html = list.some(e => e.id === EID) || !isTeam() ? list.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('') : `<option value="${esc(EID)}">${esc(S.event.name || EID)}</option>` + list.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');
    if (sel.dataset.h !== html){ sel.innerHTML = html; sel.dataset.h = html; } sel.value = EID; }
  $('#modeSeg').hidden = !isAdmin(); $('#btnSettings').hidden = !isAdmin(); $('#btnVendors').hidden = !isTeam(); $('#btnExport').hidden = !isTeam();
  $('#btnLogin').hidden = !!S.email; $('#btnLogout').hidden = !S.email;
  $('#who').hidden = !S.email; $('#who').textContent = S.email ? `${S.email}${S.role ? ' · ' + S.role : ''}` : '';
  $('#btnLogin').textContent = 'Log in';
  document.querySelector('.legend').hidden = !showStatus();
  $('#legendMine').hidden = !isVendor();
  $('#editTools').hidden = S.mode !== 'edit';
  const open = panelOpen();
  document.querySelector('.main').classList.toggle('collapsed', !open);
  $('#btnPanel').textContent = open ? 'Hide panel ›' : (isTeam() ? '‹ Show panel' : '‹ Booth list');
  $('#btnPanel').setAttribute('aria-expanded', open);
  $('#btnHand').setAttribute('aria-pressed', !!S.hand);
  $('#btnText').setAttribute('aria-pressed', !!S.addingText);
  if (S.mode !== 'edit' && S.hand){ S.hand = false; viewport.classList.remove('grab'); }
  $('#toolHint').textContent = S.mode === 'edit' ? 'Drag on empty space to draw a booth. Hold Space (or turn on Move map) to pan.' : (!isTeam() && reqOpen() && !(isVendor() && S.invite && S.invite.used) ? (isVendor() ? 'Tap a highlighted available booth to request it · drag to move around · pinch or Ctrl + scroll to zoom.' : 'Tap a booth to request it · drag to move around · pinch or Ctrl + scroll to zoom.') : 'Drag to move around · Ctrl + scroll or pinch to zoom · tap a booth for details.');
  const sel = $('#drawCat'), cur = sel.value;
  sel.innerHTML = [`<option value="">Uncategorised</option>`, ...S.cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`)].join('');
  sel.value = cur && [...sel.options].some(o => o.value === cur) ? cur : (S.cats[0]?.id || '');
}
function renderAll(){ renderTop(); renderMap(); renderSide(); }

/* ---------- live data ---------- */
renderAll();
const markLive = snap => { S.live = !snap.metadata.fromCache; };
onSnapshot(R.cfg, s => {
  const d = s.data() || {};
  S.event = {name:'', currency:'JOD', ...(d.event||{})}; S.cats = d.cats || [];
  S.noEvent = EID !== 'main' && !s.exists();
  S.legacy = {cats: d.cats || [], addons: d.addons || []};
  if (!S.pricing && (isTeam() || isVendor())) S.addons = d.addons || [];
  markLive(s); S.sideKey = ''; renderAll();
}, () => {});
onSnapshot(R.plan, s => loadPlan(s.exists() ? s.data() : null), () => {});
onSnapshot(R.layout, s => {
  const m = new Map(Object.entries((s.data() || {}).booths || {}));
  if (!S.drag || !S.drag.lid) S.labels = new Map(Object.entries((s.data() || {}).labels || {}));
  if (S.selLabel && !S.labels.has(S.selLabel)) S.selLabel = null;
  if (S.drag){ S.pendingBooths = m; return; }
  S.booths = m; if (S.sel && !S.booths.has(S.sel)) S.sel = null;
  markLive(s); renderAll();
}, () => {});
onSnapshot(R.status, s => { S.status = (s.data() || {}).map || {}; markLive(s); renderAll(); }, () => {});

</script>
